<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>StilMacros — Macro Tracker</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100dvh;
        height: 100svh;
        overflow: hidden;
      }

      :root {
        --nav-h: 4rem;
      }

      .mobile-nav {
        flex: none;
        flex-shrink: 0;
        flex-grow: 0;
        width: 100%;
        box-sizing: border-box;
        overflow: hidden;
        background-color: #09090b;
        border-top: 1px solid rgb(39 39 42);
        height: calc(var(--nav-h) + env(safe-area-inset-bottom, 12px));
        max-height: 80px;
        padding-bottom: env(safe-area-inset-bottom, 12px);
      }

      .mobile-nav__row {
        box-sizing: border-box;
        height: var(--nav-h);
        max-height: var(--nav-h);
        overflow: hidden;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
